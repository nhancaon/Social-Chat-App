apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: chat-app
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.chat-app.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: CLUSTER_ID, value: "5L6g3nShT-eMctk--x86sw" }
            # single-broker cluster — Kafka's own default (3) for the internal
            # __consumer_offsets topic can never be satisfied with 1 broker, so
            # it silently fails to ever get created, and every consumer group
            # (chat/notification/heartbeat) permanently gets "Group Coordinator
            # Not Available". App topics already set ReplicationFactor:1
            # explicitly (kafka/manager.go) — only this internal one was missing.
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: chat-app
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
