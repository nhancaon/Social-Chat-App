apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: chat-app
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-ui } }
  template:
    metadata: { labels: { app: kafka-ui } }
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KAFKA_CLUSTERS_0_NAME, value: "kafka-cluster" }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka.chat-app.svc.cluster.local:9092" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: chat-app
spec:
  selector: { app: kafka-ui }
  ports: [{ port: 8080, targetPort: 8080 }]
