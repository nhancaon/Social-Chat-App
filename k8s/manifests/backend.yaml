apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chat-app
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: nhancaon/go-appchat-api:latest
          command: ["./main"]
          args: ["--kafka=kafka.chat-app.svc.cluster.local:9092"]
          ports: [{ containerPort: 5000 }]
          env:
            - { name: PORT, value: "5000" }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: backend-secrets, key: mongodb-uri } }
            - { name: REDIS_ADDR, value: "redis.chat-app.svc.cluster.local:6379" }
            - { name: REDIS_TLS, value: "false" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: backend-secrets, key: jwt-secret } }
            - { name: AWS_REGION, value: "ap-southeast-1" }
            - name: AWS_S3_BUCKET
              valueFrom: { secretKeyRef: { name: backend-secrets, key: aws-s3-bucket } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: backend-secrets, key: aws-access-key-id } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: backend-secrets, key: aws-secret-access-key } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chat-app
  annotations:
    # this is actually a Classic ELB (in-tree cloud provider default, no
    # aws-load-balancer-type annotation set) — its default 60s idle timeout
    # silently kills WebSocket connections left open with no traffic (e.g. a
    # backgrounded browser tab), which showed up to clients as a 520 through
    # Cloudflare on the next reconnect attempt. 1h covers realistic idle gaps.
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
spec:
  type: LoadBalancer # frontend Vercel gọi vào đây, không phải ClusterIP
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 5000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: chat-app
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
