apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nhancaon/Social-Chat-App.git
    targetRevision: main
    path: k8s/manifests
  destination:
    name: eks-lab
    namespace: chat-app
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
