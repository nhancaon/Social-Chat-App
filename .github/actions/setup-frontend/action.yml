name: 'Setup Frontend Environment'
description: 'Sets up Node environment and installs frontend dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
      # cache: 'npm' tự động cache node_modules dựa theo package-lock.json,
      # không cần thêm actions/cache riêng

    - name: Install Node dependencies
      run: npm ci
      working-directory: ./frontend
      shell: bash
      # "npm ci" cài đúng y hệt version ghi trong package-lock.json,
      # không tự ý cập nhật lock file -> phù hợp với CI