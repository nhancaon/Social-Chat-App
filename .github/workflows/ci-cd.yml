name: CI/CD Pipeline

on:
  push:
    branches: [main, auto-testing]
  pull_request:
    branches: [main, auto-testing]

jobs:
  backend-tests:
    uses: ./.github/workflows/be-tests.yml
    secrets: inherit

  integration-frotend-tests:
    uses: ./.github/workflows/integration-test.yml
    needs: backend-tests
    secrets: inherit
